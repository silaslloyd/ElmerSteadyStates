# ElmerSteadyStates: as land_flowline_T2k (full flowline, moving margin), but with the bed beyond the
# margin (under the unglaciated 30 m layer, GroundedMask 0) held at the melting point, as ElmerStreams'
# tempbc does. Shares the land_flowline mesh, so no setup/init:
#
#   sbatch --ntasks=32 jobs/ess.cmd run      configs/land_flowline_T2k_melt.toml --state work/land_flowline/steady_p268.15_soft.npz --chunks 15 --rock-cap 0.001
#   sbatch --ntasks=32 jobs/ess.cmd newton   configs/land_flowline_T2k_melt.toml --state work/land_flowline_T2k_melt/run_p268.15.npz
#   sbatch --ntasks=32 jobs/ess.cmd continue configs/land_flowline_T2k_melt.toml --name flux --state work/land_flowline_T2k_melt/steady_p268.15.npz
# Relative paths are relative to the repository root; {work}, {case_dir} and {repo} are expanded.

[paths]
work_dir = "work/land_flowline_T2k_melt"
case_dir = "work/land_flowline/case"    # the land_flowline mesh (same domain)

[case]
parameters = "case/parameters.lua"      # physical parameters (copied into the case directory)
geo = "case/flowline.geo.in"            # footprint geometry template
gmsh = "gmsh"
elmergrid = "ElmerGrid"

[model]
type = "elmer"

[elmer]
template = "elmer/steady_template.sif"
mesh_db = "footprint"
ess_lib = "elmer/SteadyStateIO"         # build with: make -C elmer
ess_utils = "elmer/ess_utils.lua"
n_procs = 0                             # 0: $SLURM_NTASKS. `ess setup` partitions the mesh for this many.
mpirun = "mpirun -np {n}"
solver = "ElmerSolver"
timeout = 21600                         # seconds per Elmer run
keep_runs = false                       # true: keep every run directory (sif, log, state files)
cache = true                            # reuse finished runs (a restarted job repeats no runs)
vtu = false                             # true: every run also writes a VTU at its end
friction_heat = "flux"                  # C(T) |u_b|^2 as a basal heat flux
unglaciated_bed = "melting"             # bed beyond the margin (under the 30 m layer) held at T0, as ElmerStreams
# written with every run besides the state, used for the mask checks and plots
diagnostics = ["Temperature Loads", "Temperature Boundary Weights", "Friction Loads",
               "Velocity 1", "Velocity 3", "Zb", "ColdTempMask", "GroundedMask"]

[state]
variables = ["Temperature", "Zs"]       # the state vector (velocity is slaved to it)
scales = { Temperature = 5.0, Zs = 50.0 }   # K and m per scaled unit (norms, tolerances, FD steps)
frozen = ["ColdTempMask", "GroundedMask", "Zb", "bedrock"]

[extract]
# Only for `ess extract --restart FILE` (start from an Elmer .result in the mesh directory, written
# with the same partitioning). true: masks/bedrock/Zb from the `ess setup` tables; false: from the
# restart where it has them.
restart_before_ics = true

[parameter]
name = "Tsurf"          # any top-level assignment in parameters.lua
value = 268.15
scale = 1.0             # parameter change (K) counted like one scaled unit of state change

# The map used by Newton and continuation: n_steps of size dt (years). Its horizon T = n_steps*dt
# must be comparable to the slow time scales, or GMRES stalls on all the modes that barely change
# over T: ice-column diffusion H^2/kappa ~ 30 kyr, volume response H/a ~ 60 kyr. The 10.7 km bedrock
# would take ~2 Myr; rock_heat_capacity < 1 speeds it up (no advection there, so steady states are
# exactly the same). Use the largest dt the free surface tolerates (test with `ess run --dt`).
# Fixed points do not depend on dt, n_steps or rock_heat_capacity.
[map]
dt = 200.0
n_steps = 10
coupled_iters = 1       # >1: iterate Stokes <-> heat within each step (same fixed points)
rock_heat_capacity = 0.001

# The map used for stability: the physical transient (rock_heat_capacity = 1). Use the same dt as
# [map]: the discretisation's stabilisation depends slightly on dt, so a different dt has a slightly
# different fixed point. Backward Euler with dt = 200 is accurate for modes slower than ~100 yr
# (it reports modes with sigma dt > 2 as stable, so anything that fast would be missed).
[stability_map]
dt = 200.0
n_steps = 25
rock_heat_capacity = 1.0

[fd]
eps = 1e-6              # rms size of FD perturbations in scaled units; check with `ess check --vector residual`
scheme = "central"

[newton]
tol = 1e-5              # rms(Phi(x) - x) in scaled units over one map horizon
maxit = 15
eta_max = 0.1
eta_min = 1e-5
gmres_restart = 60
gmres_maxiter = 150
max_step = 2.0          # max change per Newton step, scaled units (10 K, 100 m)
linesearch = 6

[continuation]
name = "flux"
ds = 0.5
ds_min = 1e-3
ds_max = 2.0
dp0 = 0.01              # first step in Tsurf (K); its sign sets the direction
p_min = 255.0
p_max = 273.0
max_points = 150
max_folds = 4
tol = 1e-5
predictor = "parameter" # natural-parameter steps; arclength corrector near folds
maxit = 8
target_its = 3
eta = 1e-3
gmres_restart = 60
gmres_maxiter = 150
max_step = 2.0
stability_every = 0     # >0: a short Arnoldi (stability_m runs) at every k-th point
stability_m = 10

[stability]
m = 50                  # Krylov dimension = model runs (slow modes cluster near |mu| = 1: needs a few dozen)
nev = 10
tol = 1e-2              # Ritz residual / |mu| for a mode to count as converged
